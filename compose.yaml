name: auth-home

# Separate from tak-home. Services/containers use auth_ prefix (like tak_*).
# Joins Docker networks "auth" (own) and "tak" (shared with SWAG / tak-home).
#
#   ./setup.sh example.com -f ../docker-compose.yml
# By name (preferred on shared root compose):
#   docker compose up -d auth_lldap
#   ./scripts/migrate-users.sh --bind-only   # required before Authelia
#   docker compose up -d auth_authelia
#   docker compose up -d auth_authelia_admin
# By profile (also starts unprofiled root services when included there):
#   docker compose --profile auth up -d
#   ./scripts/migrate-users.sh --bind-only
#   docker compose up -d auth_authelia
#   docker compose --profile auth --profile admin up -d
#
# No host ports by default (SWAG proxies). For direct publish:
#   ./setup.sh example.com --no-swag
#   docker compose -f compose.yaml -f compose.no-swag.yaml up -d auth_lldap
#   ./scripts/migrate-users.sh --bind-only
#   docker compose -f compose.yaml -f compose.no-swag.yaml up -d auth_authelia

x-auth: &auth
  profiles: [auth]
  restart: unless-stopped
  networks: [auth, tak]

services:
  auth_lldap:
    <<: *auth
    image: lldap/lldap:stable
    container_name: auth_lldap
    env_file:
      - ./config/common.env
      - ./config/lldap.env
    volumes:
      # Bind mounts — data stays under auth-home/ on the host disk (not Docker named volumes)
      - ./data/lldap:/data

  auth_authelia:
    <<: *auth
    image: authelia/authelia:latest
    container_name: auth_authelia
    depends_on: [auth_lldap]
    # Official image su-exec's to PUID:PGID (default 0). Use 1001 so SQLite is
    # writable by auth_authelia_admin; setup.sh chowns data/authelia accordingly.
    environment:
      PUID: "1001"
      PGID: "1001"
    env_file:
      - ./config/common.env
      - ./config/authelia.env
    volumes:
      # File mounts (not the whole dir): entrypoint chown fails on :ro directory binds
      # Harmless: entrypoint still logs "chown: ... Read-only file system" once
      - ./config/authelia/configuration.yml:/config/configuration.yml:ro
      - ./data/authelia:/data

  # Optional UI: docker compose up -d auth_lldap auth_authelia auth_authelia_admin
  auth_authelia_admin:
    <<: *auth
    # Override anchor: admin profile only (naming the service enables it)
    profiles: [admin]
    image: ghcr.io/asalimonov/authelia-admin:latest
    container_name: auth_authelia_admin
    depends_on: [auth_authelia, auth_lldap]
    env_file:
      - ./config/common.env
      - ./config/authelia-admin.env
    volumes:
      - ./config/authelia/configuration.yml:/config/configuration.yml:ro
      - ./data/authelia:/data

networks:
  # Both pre-created (setup.sh / operator). Shared root project must not "own" them.
  auth:
    name: auth
    external: true
  tak:
    name: ${AUTH_NETWORK:-tak}
    external: true
